name: Guardrails

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    name: Repository Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run guardrail negative self-tests
        run: node tests/validate-guardrails.js --self-test

      - name: Run repository guardrails
        run: node tests/validate-guardrails.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet dependencies
        run: dotnet restore FinanceWidget.csproj

      - name: Build & verify compiler checks
        run: dotnet build FinanceWidget.csproj -c Release --no-restore -p:EnableWindowsTargeting=true -warnaserror
