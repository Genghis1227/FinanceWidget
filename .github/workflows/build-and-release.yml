name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run guardrail negative self-tests
        run: node tests/validate-guardrails.js --self-test

      - name: Run repository guardrails
        run: node tests/validate-guardrails.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FinanceWidget.csproj

      - name: Publish App
        run: dotnet publish FinanceWidget.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -warnaserror -o ./publish

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          $csproj = Get-Content -Raw FinanceWidget.csproj
          if ($csproj -notmatch '<Version>(\d+\.\d+\.\d+)</Version>') {
            Write-Error "Failed to parse SemVer <Version> from FinanceWidget.csproj"
            exit 1
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            Write-Error "Tag ref '$($env:GITHUB_REF)' does not match FinanceWidget.csproj version 'v$version'"
            exit 1
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Zip Release
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./FinanceWidget-v${{ steps.get_version.outputs.VERSION }}-win-x64.zip

      - name: Upload Release Zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ./FinanceWidget-v${{ steps.get_version.outputs.VERSION }}-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Zip
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: ./release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/FinanceWidget-v${{ needs.build.outputs.version }}-win-x64.zip
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
